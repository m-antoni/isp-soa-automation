# approve-merge-to-master — Telegram human gate before anything merges.
#
# Triggers:
# - workflow_run: fires when the CI workflow completes; the notify job gate
#                 only passes for a SUCCESSFUL CI run of a pull request whose
#                 head branch is dev (so dev → master PRs start the flow)
# - manual workflow_dispatch (to test the bot flow without a PR)
#
# Note: do NOT add a `branches:` filter to the workflow_run trigger — GitHub
# evaluates it against the wrong ref and it silently blocks the trigger
# (see community discussion #72097 / actions/runner #1628). The job-level
# `head_branch == 'dev'` gate provides the filtering instead.
#
# Sections:
# - concurrency: per-PR (per dispatch run) — one approval flow at a time
# - permissions: contents read; merge uses GH_BOT_TOKEN, not GITHUB_TOKEN;
#                PR details are fetched with gh (needs pull-requests read)
# - jobs.notify:             DMs the PR details to Telegram; outputs notified_at
# - jobs.wait-for-approval:  polls getUpdates for a reply newer than notified_at;
#                            YES → approved=yes, NO → fails, other → bot nudges you
# - jobs.merge (if 'yes'):   checkouts master, runs npm ci + tests, npm audit,
#                            then gh pr merge --rebase --delete-branch
# - jobs.notify-success:     Telegram success message after a successful merge

name: approve-merge-to-master

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: approve-master-${{ github.event.workflow_run.pull_requests[0].number || github.run_id }}

permissions:
  contents: read
  pull-requests: read

jobs:
  notify:
    runs-on: ubuntu-latest
    environment: production
    # Only proceed when the completed CI run was a successful PR to master.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.head_branch == 'dev' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    outputs:
      notified_at: ${{ steps.send.outputs.ts }}
      pr: ${{ steps.send.outputs.pr }}
    steps:
      - name: Send Telegram notification
        id: send
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          PR="$PR_NUMBER"
          if [ -z "$PR" ]; then
            PR="$(gh pr list --base master --head dev --state open --json number --jq '.[0].number // empty')"
          fi
          echo "Resolved PR number: $PR"
          if [ -z "$PR" ]; then
            echo "::error::Could not resolve the pull request number from the workflow_run payload or gh pr list"
            exit 1
          fi
          TITLE="$(gh pr view "$PR" --json title --jq .title)"
          URL="$(gh pr view "$PR" --json url --jq .url)"
          BOT_TOKEN=$(echo "$TELEGRAM_BOT_TOKEN" | tr -d '[:space:]')
          CHAT_ID=$(echo "$TELEGRAM_CHAT_ID" | tr -d '[:space:]')
          echo "Bot token length: ${#BOT_TOKEN} (Telegram tokens are 46 chars)"
          echo "Bot token starts with: ${BOT_TOKEN:0:6}... ends with: ${BOT_TOKEN: -4}"
          echo "Chat ID: $CHAT_ID"
          MSG="New PR #${PR} '${TITLE}' wants to merge into master.
          ${URL}
          Reply YES to run checks and merge, or NO to reject."
          RESP=$(curl -s "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MSG}")
          echo "Telegram response: $RESP"
          if ! echo "$RESP" | jq -e '.ok == true' > /dev/null; then
            echo "::error::Telegram sendMessage failed: $RESP"
            exit 1
          fi
          echo "ts=$(echo "$RESP" | jq -r '.result.date')" >> "$GITHUB_OUTPUT"
          echo "pr=$PR" >> "$GITHUB_OUTPUT"

  wait-for-approval:
    runs-on: ubuntu-latest
    environment: production
    needs: notify
    timeout-minutes: 30
    outputs:
      approved: ${{ steps.poll.outputs.approved }}
    steps:
      - name: Wait for approval reply
        id: poll
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SINCE: ${{ needs.notify.outputs.notified_at }}
        run: |
          BOT_TOKEN=$(echo "$TELEGRAM_BOT_TOKEN" | tr -d '[:space:]')
          CHAT_ID=$(echo "$TELEGRAM_CHAT_ID" | tr -d '[:space:]')
          offset=0
          if [ -z "$SINCE" ]; then
            echo "::error::notified_at output was empty - check the notify job log"
            exit 1
          fi
          echo "Polling for a reply newer than timestamp $SINCE..."
          while true; do
            updates=$(curl -s "https://api.telegram.org/bot${BOT_TOKEN}/getUpdates?offset=${offset}&timeout=20")
            newest=$(echo "$updates" | jq -r --argjson chat "${CHAT_ID}" --argjson since "${SINCE}" '
              [ .result[] | select(.message.chat.id == $chat and (.message.date > $since)) ]
              | if length > 0 then sort_by(.message.date)[-1].message.text else empty end')
            offset=$(echo "$updates" | jq -r '.result[-1].update_id + 1 // 0')
            if [ -n "$newest" ]; then
              if echo "$newest" | grep -qiE '^(y|yes|approve)\b'; then
                echo "approved=yes" >> "$GITHUB_OUTPUT"
                echo "Approved."
                exit 0
              elif echo "$newest" | grep -qiE '^(n|no|reject)\b'; then
                echo "Rejected by user."
                exit 1
              else
                curl -s "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
                  --data-urlencode "chat_id=${CHAT_ID}" \
                  --data-urlencode "text=Only YES or NO is acceptable. Reply YES to run checks and merge, or NO to reject."
              fi
            fi
          done

  merge:
    runs-on: ubuntu-latest
    environment: production
    needs: [wait-for-approval, notify]

    if: needs.wait-for-approval.outputs.approved == 'yes'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run checks
        run: |
          cd src
          npm ci
          npm test
      - name: Audit dependencies
        run: |
          cd src
          npm audit --audit-level=high
      - name: Merge PR
        env:
          GH_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
          GH_PR_NUMBER: ${{ needs.notify.outputs.pr }}
        run: |
          gh pr merge "$GH_PR_NUMBER" --rebase --delete-branch

  notify-success:
    runs-on: ubuntu-latest
    environment: production
    needs: merge
    if: needs.merge.result == 'success'
    steps:
      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO_NAME: ${{ github.repository }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AUTHOR: ${{ github.actor }}
        run: |
          BOT_TOKEN=$(echo "$TELEGRAM_BOT_TOKEN" | tr -d '[:space:]')
          CHAT_ID=$(echo "$TELEGRAM_CHAT_ID" | tr -d '[:space:]')
          MSG="Github Action: ci-pr -> approve-merge-to-master ✅
          Author: ${AUTHOR}
          Branch: master
          Repository: ${REPO_NAME}
          Repo link: ${REPO_URL}
          Pipeline run: ${RUN_URL}"
          RESP=$(curl -s "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            --data-urlencode "parse_mode=HTML")
          echo "Telegram response: $RESP"
          if ! echo "$RESP" | jq -e '.ok == true' > /dev/null; then
            echo "::error::Telegram sendMessage failed: $RESP"
            exit 1
          fi
