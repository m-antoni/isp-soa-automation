# deploy-dev — quality gates + SAM deploy on every push to dev.
#
# The CI checks come first via the reusable .github/workflows/ci.yml, so this
# workflow IS the dev pipeline: ci → deploy → Telegram success. Self-activating
# (plain push trigger, no workflow_run, nothing to merge to activate).
#
# Sections:
# - on: trigger — push to the dev branch + manual workflow_dispatch
# - concurrency: deploy-dev — one deploy at a time; a newer push cancels a pending one
# - permissions: contents: read (least privilege)
# - jobs.ci (uses ./.github/workflows/ci.yml): the 7 quality gates
# - jobs.deploy (needs ci, environment: development):
#   1. checkout
#   2. configure-aws-cred → assumes AWS creds into vars.AWS_REGION
#   3. setup-sam        → installs the AWS SAM CLI
#   4. sam build        → installs prod deps and packages the Lambda
#   5. sam deploy       → updates the isp-soa-automation stack, passing every
#                         Lambda env value as --parameter-overrides
# - jobs.notify (needs deploy, environment: production): Telegram success msg

name: deploy-dev

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    runs-on: ubuntu-latest
    environment: development
    needs: ci
    if: needs.ci.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Build Lambda
        run: sam build

      - name: Deploy stack
        run: |
          sam deploy \
            --stack-name isp-soa-automation \
            --region ${{ vars.AWS_REGION }} \
            --s3-bucket ${{ vars.SAM_PACKAGING_BUCKET }} \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              "Environment=dev \
               UserEmail=${{ secrets.USER_EMAIL }} \
               UserMobile=${{ secrets.USER_MOBILE }} \
               PdfPassword=${{ secrets.PDF_PASSWORD }} \
               ConvergeAccountNo=${{ secrets.CONVERGE_ACCOUNT_NO }} \
               ConvergeApiUrl=${{ vars.CONVERGE_API_URL }} \
               SoaBucketName=${{ vars.SOA_BUCKET_NAME }} \
               GmailClientId=${{ secrets.GMAIL_CLIENT_ID }} \
               GmailClientSecret=${{ secrets.GMAIL_CLIENT_SECRET }} \
               GmailRefreshToken=${{ secrets.GMAIL_REFRESH_TOKEN }} \
               MailFrom=${{ secrets.MAIL_FROM }} \
               MailTo=${{ vars.MAIL_TO }} \
               GmailAppPassword=${{ secrets.GMAIL_SMTP_APP_PASSWORD }}"

  notify:
    runs-on: ubuntu-latest
    environment: production
    needs: deploy
    if: needs.deploy.result == 'success'
    steps:
      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BRANCH: ${{ github.ref_name }}
          REPO_NAME: ${{ github.repository }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AUTHOR: ${{ github.actor }}
        run: |
          BOT_TOKEN=$(echo "$TELEGRAM_BOT_TOKEN" | tr -d '[:space:]')
          CHAT_ID=$(echo "$TELEGRAM_CHAT_ID" | tr -d '[:space:]')
          TS="$(TZ='Asia/Manila' date +'%m/%d/%Y %I:%M%p')"
          MSG="Github Action: ci:✅ deploy-dev:✅
          Author: ${AUTHOR}
          Branch: ${BRANCH}
          Repository: ${REPO_NAME}
          Repo link: ${REPO_URL}
          Pipeline run: ${RUN_URL}
          ⏱️ ${TS}"
          RESP=$(curl -s "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            --data-urlencode "parse_mode=HTML")
          echo "Telegram response: $RESP"
          if ! echo "$RESP" | jq -e '.ok == true' > /dev/null; then
            echo "::error::Telegram sendMessage failed: $RESP"
            exit 1
          fi
