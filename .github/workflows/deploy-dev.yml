# deploy-dev — deploys the SAM stack on every push to `dev`.
#
# Sections:
# - on: trigger — push to the dev branch, plus manual workflow_dispatch
# - concurrency: deploy-dev — one deploy at a time; a newer push cancels a pending one
# - permissions: actions: read — so the guard can watch the CI workflow run
# - jobs.deploy (environment: development):
#   1. checkout                 → pulls the pushed commit
#   2. wait-for-ci              → blocks until the CI workflow on this commit passes
#   3. configure-aws-cred       → assumes AWS creds into vars.AWS_REGION
#   4. setup-sam                → installs the AWS SAM CLI
#   5. sam build                → installs prod deps and packages the Lambda
#   6. sam deploy               → updates the isp-soa-automation stack, passing
#                                 every Lambda env value as --parameter-overrides

name: deploy-dev

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  actions: read

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for CI to pass
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          for i in $(seq 1 90); do
            run=$(gh run list --workflow CI --commit "$HEAD_SHA" --limit 1 --json status,conclusion --jq '.[0]')
            status=$(echo "$run" | jq -r '.status')
            conclusion=$(echo "$run" | jq -r '.conclusion')
            echo "CI run status: ${status}, conclusion: ${conclusion}"
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "CI passed — proceeding to deploy."
                exit 0
              fi
              echo "::error::CI failed with conclusion: ${conclusion}. Not deploying."
              exit 1
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for CI to finish."
          exit 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Build Lambda
        run: sam build

      - name: Deploy stack
        run: |
          sam deploy \
            --stack-name isp-soa-automation \
            --region ${{ vars.AWS_REGION }} \
            --s3-bucket ${{ vars.SAM_PACKAGING_BUCKET }} \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              "Environment=dev \
               UserEmail=${{ secrets.USER_EMAIL }} \
               UserMobile=${{ secrets.USER_MOBILE }} \
               PdfPassword=${{ secrets.PDF_PASSWORD }} \
               ConvergeAccountNo=${{ secrets.CONVERGE_ACCOUNT_NO }} \
               ConvergeApiUrl=${{ vars.CONVERGE_API_URL }} \
               SoaBucketName=${{ vars.SOA_BUCKET_NAME }} \
               GmailClientId=${{ secrets.GMAIL_CLIENT_ID }} \
               GmailClientSecret=${{ secrets.GMAIL_CLIENT_SECRET }} \
               GmailRefreshToken=${{ secrets.GMAIL_REFRESH_TOKEN }} \
               MailFrom=${{ secrets.MAIL_FROM }} \
               MailTo=${{ vars.MAIL_TO }} \
               GmailAppPassword=${{ secrets.GMAIL_SMTP_APP_PASSWORD }}"

  notify:
    runs-on: ubuntu-latest
    environment: production
    needs: deploy
    if: success()
    steps:
      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BRANCH: ${{ github.ref_name }}
          REPO_NAME: ${{ github.repository }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AUTHOR: ${{ github.actor }}
        run: |
          BOT_TOKEN=$(echo "$TELEGRAM_BOT_TOKEN" | tr -d '[:space:]')
          CHAT_ID=$(echo "$TELEGRAM_CHAT_ID" | tr -d '[:space:]')
          MSG="Github Action: deploy-dev ✅
          Author: ${AUTHOR}
          Branch: ${BRANCH}
          Repository: ${REPO_NAME}
          Repo link: ${REPO_URL}
          Pipeline run: ${RUN_URL}"
          RESP=$(curl -s "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            --data-urlencode "parse_mode=HTML")
          echo "Telegram response: $RESP"
          if ! echo "$RESP" | jq -e '.ok == true' > /dev/null; then
            echo "::error::Telegram sendMessage failed: $RESP"
            exit 1
          fi
