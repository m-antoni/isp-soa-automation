# deploy-dev — deploys the SAM stack AFTER CI passes.
#
# Sections:
# - on: trigger — workflow_run: fires when the CI (dev) workflow completes; the
#                 deploy job only runs for a successful CI run of a push to dev.
#                 workflow_dispatch: manual deploy anytime (bypasses the CI gate).
# - concurrency: deploy-dev — one deploy at a time; a newer one cancels a pending one
# - permissions: actions + contents read (checkout needs `contents`)
# - jobs.deploy (environment: development):
#   1. checkout                 → pulls the code
#   2. configure-aws-cred       → assumes AWS creds into vars.AWS_REGION
#   3. setup-sam                → installs the AWS SAM CLI
#   4. sam build                → installs prod deps and packages the Lambda
#   5. sam deploy               → updates the isp-soa-automation stack, passing
#                                 every Lambda env value as --parameter-overrides
# - jobs.notify: Telegram success message after a successful deploy.

name: deploy-dev

on:
  workflow_run:
    workflows: ["CI (dev)"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development
    # Only deploy when the completed CI run was a successful push to dev.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'dev' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Build Lambda
        run: sam build

      - name: Deploy stack
        run: |
          sam deploy \
            --stack-name isp-soa-automation \
            --region ${{ vars.AWS_REGION }} \
            --s3-bucket ${{ vars.SAM_PACKAGING_BUCKET }} \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              "Environment=dev \
               UserEmail=${{ secrets.USER_EMAIL }} \
               UserMobile=${{ secrets.USER_MOBILE }} \
               PdfPassword=${{ secrets.PDF_PASSWORD }} \
               ConvergeAccountNo=${{ secrets.CONVERGE_ACCOUNT_NO }} \
               ConvergeApiUrl=${{ vars.CONVERGE_API_URL }} \
               SoaBucketName=${{ vars.SOA_BUCKET_NAME }} \
               GmailClientId=${{ secrets.GMAIL_CLIENT_ID }} \
               GmailClientSecret=${{ secrets.GMAIL_CLIENT_SECRET }} \
               GmailRefreshToken=${{ secrets.GMAIL_REFRESH_TOKEN }} \
               MailFrom=${{ secrets.MAIL_FROM }} \
               MailTo=${{ vars.MAIL_TO }} \
               GmailAppPassword=${{ secrets.GMAIL_SMTP_APP_PASSWORD }}"

  notify:
    runs-on: ubuntu-latest
    environment: production
    needs: deploy
    if: needs.deploy.result == 'success'
    steps:
      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          REPO_NAME: ${{ github.repository }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AUTHOR: ${{ github.actor }}
        run: |
          BOT_TOKEN=$(echo "$TELEGRAM_BOT_TOKEN" | tr -d '[:space:]')
          CHAT_ID=$(echo "$TELEGRAM_CHAT_ID" | tr -d '[:space:]')
          MSG="Github Action: deploy-dev ✅ the status of CI succeeded
          Author: ${AUTHOR}
          Branch: ${BRANCH}
          Repository: ${REPO_NAME}
          Repo link: ${REPO_URL}
          Pipeline run: ${RUN_URL}"
          RESP=$(curl -s "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            --data-urlencode "parse_mode=HTML")
          echo "Telegram response: $RESP"
          if ! echo "$RESP" | jq -e '.ok == true' > /dev/null; then
            echo "::error::Telegram sendMessage failed: $RESP"
            exit 1
          fi
