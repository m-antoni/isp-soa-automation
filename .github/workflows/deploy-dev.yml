# deploy-dev — deploys the SAM stack on every push to `dev`.
#
# Sections:
# - on: trigger — push to the dev branch, plus manual workflow_dispatch
# - concurrency: deploy-dev — one deploy at a time; a newer push cancels a pending one
# - jobs.deploy (environment: development):
#   1. checkout                 → pulls the pushed commit
#   2. configure-aws-cred       → assumes AWS creds into vars.AWS_REGION
#   3. setup-sam                → installs the AWS SAM CLI
#   4. sam build                → installs prod deps and packages the Lambda
#   5. sam deploy               → updates the isp-soa-automation stack, passing
#                                 every Lambda env value as --parameter-overrides

name: deploy-dev

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Build Lambda
        run: sam build

      - name: Deploy stack
        run: |
          sam deploy \
            --stack-name isp-soa-automation \
            --region ${{ vars.AWS_REGION }} \
            --s3-bucket ${{ vars.SAM_PACKAGING_BUCKET }} \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              "Environment=dev \
               UserEmail=${{ secrets.USER_EMAIL }} \
               UserMobile=${{ secrets.USER_MOBILE }} \
               PdfPassword=${{ secrets.PDF_PASSWORD }} \
               ConvergeAccountNo=${{ secrets.CONVERGE_ACCOUNT_NO }} \
               ConvergeApiUrl=${{ vars.CONVERGE_API_URL }} \
               SoaBucketName=${{ vars.SOA_BUCKET_NAME }} \
               GmailClientId=${{ secrets.GMAIL_CLIENT_ID }} \
               GmailClientSecret=${{ secrets.GMAIL_CLIENT_SECRET }} \
               GmailRefreshToken=${{ secrets.GMAIL_REFRESH_TOKEN }} \
               MailFrom=${{ secrets.MAIL_FROM }} \
               MailTo=${{ vars.MAIL_TO }} \
               GmailAppPassword=${{ secrets.GMAIL_SMTP_APP_PASSWORD }}"

  notify:
    runs-on: ubuntu-latest
    environment: production
    needs: deploy
    if: success()
    steps:
      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BRANCH: ${{ github.ref_name }}
          REPO_NAME: ${{ github.repository }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BOT_TOKEN=$(echo "$TELEGRAM_BOT_TOKEN" | tr -d '[:space:]')
          CHAT_ID=$(echo "$TELEGRAM_CHAT_ID" | tr -d '[:space:]')
          MSG="🌐 deploy-dev succeeded
          Branch: ${BRANCH}
          Repository: ${REPO_NAME}
          Repo link: ${REPO_URL}
          Pipeline run: ${RUN_URL}"
          RESP=$(curl -s "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            --data-urlencode "parse_mode=HTML")
          echo "Telegram response: $RESP"
          if ! echo "$RESP" | jq -e '.ok == true' > /dev/null; then
            echo "::error::Telegram sendMessage failed: $RESP"
            exit 1
          fi
